name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.6'
  # Kalıcı Android imza sertifikasının SHA-256 parmak izi (gizli değil).
  ANDROID_CERT_SHA256: '561189bea2c435333d99bf1c073d87a1d3c72ed8e4bc225066b01d0f748ae70d'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Sürüm derlemesi için ANDROID_KEYSTORE_BASE64 ve ANDROID_KEYSTORE_PASSWORD gizli değişkenleri gerekli."
              exit 1
            fi
            echo "::warning::İmza anahtarı tanımlı değil; APK geçici hata ayıklama anahtarıyla imzalanacak."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=umre\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk umre-rehberi.apk
      - name: APK imzasını doğrula
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs umre-rehberi.apk | tee imza.txt
          if [ -f android/key.properties ] && ! grep -qi "SHA-256 digest: $ANDROID_CERT_SHA256" imza.txt; then
            echo "::error::APK kalıcı anahtarla imzalanmamış."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: umre-rehberi-android
          path: umre-rehberi.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: İmzasız IPA paketle
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr umre-rehberi-imzasiz.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: umre-rehberi-ios
          path: umre-rehberi-imzasiz.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
